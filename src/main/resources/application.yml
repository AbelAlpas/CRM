spring:
  application:
    name: CRM
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm}
    username: ${DB_USERNAME:crm_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  error:
    whitelabel:
      enabled: false

crm:
  security:
    bootstrap-admin:
      enabled: ${CRM_BOOTSTRAP_ADMIN_ENABLED:false}
      first-name: ${CRM_ADMIN_FIRST_NAME:Development}
      last-name: ${CRM_ADMIN_LAST_NAME:Administrator}
      email: ${CRM_ADMIN_EMAIL:}
      password: ${CRM_ADMIN_PASSWORD:}
