<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(~{::main})}">
<main>
  <div class="d-flex align-items-center gap-3 mb-4"><a class="btn btn-sm btn-outline-secondary" th:href="${editing} ? @{/activities/{id}(id=${activityId})} : @{/activities}" title="Volver"><i class="bi bi-arrow-left"></i></a><div><h1 class="h3 mb-1" th:text="${editing ? 'Editar actividad' : 'Nueva actividad'}">Actividad</h1><p class="text-body-secondary mb-0">Registra el siguiente paso comercial.</p></div></div>
  <form method="post" th:action="${formAction}" th:object="${activityForm}" class="row g-3">
    <div class="col-12" th:if="${#fields.hasGlobalErrors()}"><div class="alert alert-danger" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</div></div>
    <div class="col-lg-8">
      <div class="card"><div class="card-body"><div class="row g-3">
        <div class="col-md-4"><label class="form-label" for="activityType">Tipo</label><select class="form-select" id="activityType" th:field="*{activityType}" th:classappend="${#fields.hasErrors('activityType')} ? ' is-invalid' : ''"><option value="">Selecciona</option><option th:each="item : ${types}" th:value="${item}" th:text="${item.label}">Tarea</option></select><div class="invalid-feedback" th:errors="*{activityType}"></div></div>
        <div class="col-md-4"><label class="form-label" for="priority">Prioridad</label><select class="form-select" id="priority" th:field="*{priority}" th:classappend="${#fields.hasErrors('priority')} ? ' is-invalid' : ''"><option th:each="item : ${priorities}" th:value="${item}" th:text="${item.label}">Media</option></select><div class="invalid-feedback" th:errors="*{priority}"></div></div>
        <div class="col-12"><label class="form-label" for="subject">Asunto</label><input class="form-control" id="subject" maxlength="180" th:field="*{subject}" th:classappend="${#fields.hasErrors('subject')} ? ' is-invalid' : ''"><div class="invalid-feedback" th:errors="*{subject}"></div></div>
        <div class="col-12"><label class="form-label" for="description">Descripcion</label><textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea></div>
        <div class="col-md-6"><label class="form-label" for="scheduledAt">Fecha y hora programada</label><input class="form-control" type="datetime-local" id="scheduledAt" th:field="*{scheduledAt}"></div>
        <div class="col-md-6"><label class="form-label" for="dueAt">Fecha y hora limite</label><input class="form-control" type="datetime-local" id="dueAt" th:field="*{dueAt}"></div>
      </div></div></div>

      <div class="card mt-3" th:unless="${editing}"><div class="card-body"><h2 class="h5 mb-1">Relacionado con</h2><p class="text-body-secondary small">Selecciona como maximo una entidad comercial.</p><div class="row g-3">
        <div class="col-md-4"><label class="form-label" for="leadId">Lead</label><select class="form-select activity-relation-select" id="leadId" th:field="*{leadId}"><option value="">Sin Lead</option><option th:each="lead : ${leads}" th:value="${lead.id}" th:text="${lead.firstName + (lead.lastName != null ? ' ' + lead.lastName : '') + (lead.companyName != null ? ' - ' + lead.companyName : '')}">Lead</option></select></div>
        <div class="col-md-4"><label class="form-label" for="clientId">Cliente</label><select class="form-select activity-relation-select" id="clientId" th:field="*{clientId}"><option value="">Sin Cliente</option><option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.clientType.name() == 'COMPANY' ? client.companyName : client.firstName + (client.lastName != null ? ' ' + client.lastName : '')}">Cliente</option></select></div>
        <div class="col-md-4"><label class="form-label" for="opportunityId">Oportunidad</label><select class="form-select activity-relation-select" id="opportunityId" th:field="*{opportunityId}"><option value="">Sin Oportunidad</option><option th:each="opportunity : ${opportunities}" th:value="${opportunity.id}" th:text="${opportunity.name}">Oportunidad</option></select></div>
      </div></div></div>

      <div class="card mt-3" th:if="${editing}"><div class="card-body"><h2 class="h5 mb-2">Relacionado con</h2><p class="mb-0" th:if="${activity.lead != null}">Lead: <a th:href="@{/leads/{id}(id=${activity.lead.id})}" th:text="${activity.lead.firstName + (activity.lead.lastName != null ? ' ' + activity.lead.lastName : '')}">Lead</a></p><p class="mb-0" th:if="${activity.client != null}">Cliente: <a th:href="@{/clients/{id}(id=${activity.client.id})}" th:text="${activity.client.clientType.name() == 'COMPANY' ? activity.client.companyName : activity.client.firstName + (activity.client.lastName != null ? ' ' + activity.client.lastName : '')}">Cliente</a></p><p class="mb-0" th:if="${activity.opportunity != null}">Oportunidad: <a th:href="@{/opportunities/{id}(id=${activity.opportunity.id})}" th:text="${activity.opportunity.name}">Oportunidad</a></p><p class="text-body-secondary mb-0" th:if="${activity.lead == null and activity.client == null and activity.opportunity == null}">Actividad general</p></div></div>
    </div>
    <div class="col-lg-4"><div class="card"><div class="card-body"><h2 class="h5 mb-3">Responsable</h2><div th:if="${canAssign}"><label class="form-label" for="ownerId">Usuario asignado</label><select class="form-select" id="ownerId" th:field="*{ownerId}"><option value="">Selecciona</option><option th:each="owner : ${owners}" th:value="${owner.id}" th:text="${owner.firstName + ' ' + owner.lastName}">Responsable</option></select></div><p class="text-body-secondary mb-0" th:unless="${canAssign}">La actividad se asignara automaticamente a tu usuario.</p><hr><div class="d-grid gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i><span th:text="${editing ? 'Guardar cambios' : 'Crear actividad'}">Guardar</span></button><a class="btn btn-outline-secondary" th:href="${editing} ? @{/activities/{id}(id=${activityId})} : @{/activities}">Cancelar</a></div></div></div></div>
  </form>
  <script th:unless="${editing}" th:src="@{/js/activity-form.js}" defer></script>
</main>
</html>
