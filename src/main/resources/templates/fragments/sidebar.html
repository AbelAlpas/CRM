<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="crm-sidebar bg-dark text-white p-3" th:fragment="sidebar(activeModule)">
    <a class="d-flex align-items-center gap-2 text-white text-decoration-none mb-4" th:href="@{/dashboard}">
        <i class="bi bi-bar-chart-fill"></i><span class="fs-5 fw-semibold">CRM</span>
    </a>
    <nav class="nav nav-pills flex-column gap-1" aria-label="Navegacion principal">
        <a class="nav-link text-white" th:classappend="${activeModule == 'dashboard'} ? ' active bg-primary' : ''" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link text-white" th:classappend="${activeModule == 'leads'} ? ' active bg-primary' : ''" th:href="@{/leads}"><i class="bi bi-person-lines-fill me-2"></i>Leads</a>
        <a class="nav-link text-white" th:classappend="${activeModule == 'clients'} ? ' active bg-primary' : ''" th:href="@{/clients}"><i class="bi bi-people me-2"></i>Clientes</a>
        <a class="nav-link text-white" th:classappend="${activeModule == 'opportunities'} ? ' active bg-primary' : ''" th:href="@{/opportunities}"><i class="bi bi-briefcase me-2"></i>Oportunidades</a>
        <a class="nav-link text-white-50 disabled" href="#" aria-disabled="true"><i class="bi bi-kanban me-2"></i>Pipeline</a>
        <a class="nav-link text-white-50 disabled" href="#" aria-disabled="true"><i class="bi bi-calendar-event me-2"></i>Actividades</a>
        <a class="nav-link text-white" th:classappend="${activeModule == 'users'} ? ' active bg-primary' : ''" th:href="@{/users}"><i class="bi bi-person-gear me-2"></i>Usuarios</a>
    </nav>
</aside>
</body>
</html>
