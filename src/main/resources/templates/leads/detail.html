<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(~{::main})}">
<main><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1" th:text="${lead.firstName + (lead.lastName != null ? ' ' + lead.lastName : '')}">Lead</h1><p class="text-body-secondary mb-0" th:text="${lead.companyName ?: 'Sin empresa'}">Empresa</p></div><a class="btn btn-outline-primary" th:href="@{/leads/{id}/edit(id=${lead.id})}"><i class="bi bi-pencil me-1"></i>Editar</a></div><div class="row g-3"><div class="col-lg-8"><div class="card"><div class="card-body"><h2 class="h5 mb-3">Informacion comercial</h2><dl class="row mb-0"><dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${lead.email ?: '-'}">-</dd><dt class="col-sm-4">Telefono</dt><dd class="col-sm-8" th:text="${lead.phone ?: '-'}">-</dd><dt class="col-sm-4">Origen</dt><dd class="col-sm-8" th:text="${lead.source.label}">WEBSITE</dd><dt class="col-sm-4">Vendedor</dt><dd class="col-sm-8" th:text="${lead.assignedTo != null ? lead.assignedTo.firstName + ' ' + lead.assignedTo.lastName : 'Sin asignar'}">-</dd><dt class="col-sm-4">Notas</dt><dd class="col-sm-8 text-break" th:text="${lead.notes ?: '-'}">-</dd></dl></div></div></div><div class="col-lg-4"><div class="card"><div class="card-body"><h2 class="h5 mb-3">Estado</h2><span class="badge text-bg-primary mb-3" th:text="${lead.status.label}">NEW</span><form method="post" th:action="@{/leads/{id}/status(id=${lead.id})}"><label class="form-label" for="status">Cambiar estado</label><select class="form-select mb-2" id="status" name="status"><option th:each="item : ${T(com.example.CRM.lead.entity.LeadStatus).values()}" th:if="${item.name() != 'CONVERTED'}" th:value="${item}" th:text="${item.label}">NEW</option></select><button class="btn btn-outline-primary w-100" type="submit">Actualizar estado</button></form><hr><small class="text-body-secondary d-block">Creado por: <span th:text="${lead.createdBy != null ? lead.createdBy.firstName + ' ' + lead.createdBy.lastName : '-'}">-</span></small><small class="text-body-secondary d-block">Creado: <span th:text="${#temporals.format(lead.createdAt, 'dd/MM/yyyy HH:mm')}">-</span></small><small class="text-body-secondary d-block">Actualizado: <span th:text="${#temporals.format(lead.updatedAt, 'dd/MM/yyyy HH:mm')}">-</span></small></div></div></div></div></main>
</html>
