<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(~{::main})}">
<main><div class="row justify-content-center"><div class="col-xl-9"><div class="card"><div class="card-body"><h1 class="h4 mb-4" th:text="${editing} ? 'Editar Lead' : 'Nuevo Lead'">Lead</h1><form method="post" th:object="${leadForm}" th:action="${editing} ? @{/leads/{id}/edit(id=${leadId})} : @{/leads}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="firstName">Nombres</label><input class="form-control" id="firstName" th:field="*{firstName}" required><div class="text-danger small" th:errors="*{firstName}"></div></div><div class="col-md-6"><label class="form-label" for="lastName">Apellidos</label><input class="form-control" id="lastName" th:field="*{lastName}"><div class="text-danger small" th:errors="*{lastName}"></div></div><div class="col-md-6"><label class="form-label" for="companyName">Empresa</label><input class="form-control" id="companyName" th:field="*{companyName}"><div class="text-danger small" th:errors="*{companyName}"></div></div><div class="col-md-6"><label class="form-label" for="source">Origen</label><select class="form-select" id="source" th:field="*{source}" required><option th:each="item : ${sources}" th:value="${item}" th:text="${item.label}">WEBSITE</option></select><div class="text-danger small" th:errors="*{source}"></div></div><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label" for="phone">Telefono</label><input class="form-control" id="phone" th:field="*{phone}"><div class="text-danger small" th:errors="*{phone}"></div></div><div class="col-md-6" th:if="${canAssign}"><label class="form-label" for="assignedToId">Vendedor asignado</label><select class="form-select" id="assignedToId" th:field="*{assignedToId}"><option value="">Sin asignar</option><option th:each="user : ${salesUsers}" th:value="${user.id}" th:text="${user.firstName + ' ' + user.lastName}">Vendedor</option></select></div><div class="col-md-6" th:if="${editing and canAssign}"><label class="form-label" for="status">Estado</label><select class="form-select" id="status" th:field="*{status}"><option th:each="item : ${statuses}" th:value="${item}" th:text="${item.label}">NEW</option></select></div><div class="col-12"><label class="form-label" for="notes">Notas</label><textarea class="form-control" id="notes" rows="4" th:field="*{notes}"></textarea><div class="text-danger small" th:errors="*{notes}"></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="${editing} ? @{/leads/{id}(id=${leadId})} : @{/leads}">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar Lead</button></div></form></div></div></div></div></main>
</html>
