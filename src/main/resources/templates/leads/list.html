<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(~{::main})}">
<main>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1">Leads</h1><p class="text-body-secondary mb-0">Prospectos comerciales del CRM.</p></div><a class="btn btn-primary" th:href="@{/leads/new}"><i class="bi bi-plus-lg me-1"></i>Nuevo Lead</a></div>
    <form class="card card-body mb-4" method="get" th:action="@{/leads}"><div class="row g-2 align-items-end"><div class="col-lg-4"><label class="form-label" for="q">Buscar</label><input class="form-control" id="q" name="q" th:value="${q}" placeholder="Nombre, empresa, email o telefono"></div><div class="col-md-3 col-lg-2"><label class="form-label" for="status">Estado</label><select class="form-select" id="status" name="status"><option value="">Todos</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item.label}" th:selected="${item == selectedStatus}">NEW</option></select></div><div class="col-md-3 col-lg-2"><label class="form-label" for="source">Origen</label><select class="form-select" id="source" name="source"><option value="">Todos</option><option th:each="item : ${sources}" th:value="${item}" th:text="${item.label}" th:selected="${item == selectedSource}">WEBSITE</option></select></div><div class="col-md-3 col-lg-2" th:if="${canAssign}"><label class="form-label" for="assignedToId">Vendedor</label><select class="form-select" id="assignedToId" name="assignedToId"><option value="">Todos</option><option th:each="user : ${salesUsers}" th:value="${user.id}" th:text="${user.firstName + ' ' + user.lastName}" th:selected="${user.id == selectedAssignedToId}">Vendedor</option></select></div><div class="col-md-3 col-lg-2 d-flex gap-2"><button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i><span class="ms-1">Filtrar</span></button><a class="btn btn-outline-secondary" th:href="@{/leads}" title="Limpiar filtros"><i class="bi bi-x-lg"></i></a></div></div></form>
    <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Nombre</th><th>Empresa</th><th>Contacto</th><th>Origen</th><th>Estado</th><th>Vendedor</th><th>Creado</th><th></th></tr></thead><tbody><tr th:each="lead : ${leads.content}"><td th:text="${lead.firstName + (lead.lastName != null ? ' ' + lead.lastName : '')}">Nombre</td><td th:text="${lead.companyName ?: '-'}">Empresa</td><td><div th:text="${lead.email ?: '-'}">email</div><small class="text-body-secondary" th:text="${lead.phone ?: ''}"></small></td><td th:text="${lead.source.label}">WEBSITE</td><td><span class="badge text-bg-primary" th:text="${lead.status.label}">NEW</span></td><td th:text="${lead.assignedTo != null ? lead.assignedTo.firstName + ' ' + lead.assignedTo.lastName : 'Sin asignar'}">Vendedor</td><td th:text="${#temporals.format(lead.createdAt, 'dd/MM/yyyy')}">01/01/2026</td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/leads/{id}(id=${lead.id})}" title="Ver"><i class="bi bi-eye"></i></a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/leads/{id}/edit(id=${lead.id})}" title="Editar"><i class="bi bi-pencil"></i></a></td></tr><tr th:if="${leads.empty}"><td colspan="8" class="text-center text-body-secondary py-5" th:text="${q != null or selectedStatus != null or selectedSource != null or selectedAssignedToId != null ? 'No se encontraron leads con los filtros seleccionados.' : 'No se encontraron leads.'}">No se encontraron leads.</td></tr></tbody></table></div></div>
    <nav class="mt-3" th:if="${leads.totalPages > 1}" aria-label="Paginacion de leads"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${leads.first} ? ' disabled' : ''"><a class="page-link" th:href="@{/leads(page=${leads.number - 1},q=${q},status=${selectedStatus},source=${selectedSource},assignedToId=${selectedAssignedToId})}">Anterior</a></li><li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, leads.totalPages - 1)}" th:classappend="${pageNumber == leads.number} ? ' active' : ''"><a class="page-link" th:text="${pageNumber + 1}" th:href="@{/leads(page=${pageNumber},q=${q},status=${selectedStatus},source=${selectedSource},assignedToId=${selectedAssignedToId})}">1</a></li><li class="page-item" th:classappend="${leads.last} ? ' disabled' : ''"><a class="page-link" th:href="@{/leads(page=${leads.number + 1},q=${q},status=${selectedStatus},source=${selectedSource},assignedToId=${selectedAssignedToId})}">Siguiente</a></li></ul></nav>
</main>
</html>
