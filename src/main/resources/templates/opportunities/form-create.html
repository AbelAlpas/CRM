<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(~{::main})}">
<main><div class="row justify-content-center"><div class="col-xl-9"><div class="card"><div class="card-body">
  <h1 class="h4 mb-4">Nueva oportunidad</h1>
  <form method="post" th:action="@{/opportunities}" th:object="${opportunityCreateRequest}">
    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</div>
    <h2 class="h6 text-uppercase text-body-secondary mb-3">Información</h2>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="name">Nombre de oportunidad</label><input class="form-control" id="name" th:field="*{name}" maxlength="180" required><div class="text-danger small" th:errors="*{name}"></div></div>
      <div class="col-md-6"><label class="form-label" for="clientId">Cliente</label><select class="form-select" id="clientId" th:field="*{clientId}" required><option value="">Seleccionar cliente</option><option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.clientType.name() == 'COMPANY' ? client.companyName : client.firstName + (client.lastName != null ? ' ' + client.lastName : '')}">Cliente</option></select><div class="text-danger small" th:errors="*{clientId}"></div></div>
      <div class="col-12"><label class="form-label" for="description">Descripción</label><textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea></div>
    </div>
    <hr class="my-4"><h2 class="h6 text-uppercase text-body-secondary mb-3">Valor comercial</h2>
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label" for="amount">Monto (S/)</label><input class="form-control" id="amount" type="number" min="0.01" step="0.01" th:field="*{amount}" required><div class="text-danger small" th:errors="*{amount}"></div></div>
      <div class="col-md-4"><label class="form-label" for="probability">Probabilidad (%)</label><input class="form-control" id="probability" type="number" min="0" max="100" th:field="*{probability}" required><div class="text-danger small" th:errors="*{probability}"></div></div>
      <div class="col-md-4"><label class="form-label" for="expectedCloseDate">Fecha esperada de cierre</label><input class="form-control" id="expectedCloseDate" type="date" th:field="*{expectedCloseDate}"></div>
    </div>
    <hr class="my-4"><h2 class="h6 text-uppercase text-body-secondary mb-3">Gestión</h2>
    <div class="row g-3"><div class="col-md-6" th:if="${canAssign}"><label class="form-label" for="ownerId">Vendedor responsable</label><select class="form-select" id="ownerId" th:field="*{ownerId}" required><option value="">Seleccionar vendedor</option><option th:each="owner : ${owners}" th:value="${owner.id}" th:text="${owner.firstName + ' ' + owner.lastName}">Vendedor</option></select><div class="text-danger small" th:errors="*{ownerId}"></div></div><div class="col-md-6" th:unless="${canAssign}"><p class="form-label mb-1">Vendedor responsable</p><p class="form-control-plaintext">Se asignará automáticamente a tu usuario.</p></div></div>
    <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/opportunities}">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Crear oportunidad</button></div>
  </form>
</div></div></div></div></main>
</html>
