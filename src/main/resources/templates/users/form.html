<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: shell(~{::main})}"
>
  <main>
    <div class="row justify-content-center">
      <div class="col-xl-8">
        <div class="card">
          <div class="card-body">
            <h1
              class="h4 mb-4"
              th:text="${editing} ? 'Editar usuario' : 'Nuevo usuario'"
            >
              Usuario
            </h1>
            <form
              method="post"
              th:object="${userForm}"
              th:action="${editing} ? @{/users/{id}(id=${userId})} : @{/users}"
            >
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="firstName">Nombre</label
                  ><input
                    class="form-control"
                    id="firstName"
                    th:field="*{firstName}"
                    required
                  />
                  <div
                    class="invalid-feedback d-block"
                    th:errors="*{firstName}"
                  ></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="lastName">Apellido</label
                  ><input
                    class="form-control"
                    id="lastName"
                    th:field="*{lastName}"
                    required
                  />
                  <div
                    class="invalid-feedback d-block"
                    th:errors="*{lastName}"
                  ></div>
                </div>
                <div class="col-12">
                  <label class="form-label" for="email">Email</label
                  ><input
                    class="form-control"
                    id="email"
                    type="email"
                    th:field="*{email}"
                    required
                  />
                  <div
                    class="invalid-feedback d-block"
                    th:errors="*{email}"
                  ></div>
                </div>
                <div class="col-12">
                  <label class="form-label" for="password"
                    >Contrasena
                    <span class="text-body-secondary" th:if="${editing}"
                      >(dejar vacio para conservarla)</span
                    ></label
                  ><input
                    class="form-control"
                    id="password"
                    type="password"
                    th:field="*{password}"
                    th:required="${!editing}"
                  />
                  <div
                    class="invalid-feedback d-block"
                    th:errors="*{password}"
                  ></div>
                </div>
                <div class="col-12">
                  <span class="form-label d-block">Roles</span>
                  <div
                    class="form-check form-check-inline"
                    th:each="role : ${availableRoles}"
                  >
                    <input
                      class="form-check-input"
                      type="checkbox"
                      th:field="*{roles}"
                      th:value="${role}"
                      th:id="${'role-' + role}"
                    /><label
                      class="form-check-label"
                      th:for="${'role-' + role}"
                      th:text="${role}"
                      >ADMIN</label
                    >
                  </div>
                  <div
                    class="invalid-feedback d-block"
                    th:errors="*{roles}"
                  ></div>
                </div>
                <div class="col-12 form-check ms-2">
                  <input
                    class="form-check-input"
                    id="enabled"
                    type="checkbox"
                    th:field="*{enabled}"
                  /><label class="form-check-label" for="enabled"
                    >Usuario habilitado</label
                  >
                </div>
              </div>
              <div class="d-flex gap-2 justify-content-end mt-4">
                <a class="btn btn-outline-secondary" th:href="@{/users}"
                  >Cancelar</a
                ><button class="btn btn-primary" type="submit">
                  <i class="bi bi-check-lg me-1"></i>Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</html>
