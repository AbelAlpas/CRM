<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: shell(~{::main})}"
>
  <main>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Usuarios</h1>
      <a class="btn btn-primary" th:href="@{/users/new}"
        ><i class="bi bi-plus-lg me-1"></i>Nuevo usuario</a
      >
    </div>
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Roles</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="user : ${users}">
              <td th:text="${user.firstName + ' ' + user.lastName}">Nombre</td>
              <td th:text="${user.email}">email</td>
              <td>
                <span
                  class="badge text-bg-secondary me-1"
                  th:each="role : ${user.roles}"
                  th:text="${role.name}"
                  >ADMIN</span
                >
              </td>
              <td>
                <span
                  class="badge"
                  th:classappend="${user.enabled} ? ' text-bg-success' : ' text-bg-secondary'"
                  th:text="${user.enabled ? 'Activo' : 'Inactivo'}"
                  >Activo</span
                >
              </td>
              <td class="text-end">
                <a
                  class="btn btn-sm btn-outline-primary"
                  th:href="@{/users/{id}/edit(id=${user.id})}"
                  title="Editar"
                  ><i class="bi bi-pencil"></i
                ></a>
                <form
                  class="d-inline"
                  method="post"
                  th:action="@{/users/{id}/delete(id=${user.id})}"
                >
                  <button
                    class="btn btn-sm btn-outline-danger"
                    type="submit"
                    title="Eliminar"
                    onclick="return confirm('Eliminar usuario?');"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
              <td colspan="5" class="text-center text-body-secondary py-4">
                No hay usuarios registrados.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</html>
